name: Compilació per a Linux (CI/CD)

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar codi font del repositori
        uses: actions/checkout@v4

      - name: Configurar entorn de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instal·lar dependències del sistema operatiu (Ubuntu/Debian)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libsndfile1 espeak-ng alsa-utils libsdl2-2.0-0

      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install piper-tts pathvalidate

      - name: Executar proves automatitzades de funcionalitats
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python test_features.py

      - name: Compilar paquet binari per a Linux
        run: |
          python build_linux.py

      - name: Pujar artefacte comprimit a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PodcastsAmbMatxa-Linux-x86_64
          path: dist/PodcastsAmbMatxa-*-Linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Adjuntar paquet a la Release de GitHub (si correspon)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PodcastsAmbMatxa-*-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
