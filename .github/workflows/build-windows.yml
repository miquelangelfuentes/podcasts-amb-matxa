name: Compilació per a Windows (CI/CD)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar codi font del repositori
        uses: actions/checkout@v4

      - name: Configurar entorn de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller piper-tts pathvalidate

      - name: Executar proves automatitzades de funcionalitats
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python test_features.py

      - name: Compilar paquet executable per a Windows (.exe)
        run: |
          python build_exe.py

      - name: Comprovar el contingut del paquet Windows
        shell: pwsh
        run: |
          $zipPath = "dist/PodcastsAmbMatxa-v1.1.3-Windows.zip"
          if (-not (Test-Path $zipPath)) { throw "No s'ha generat el paquet v1.1.3" }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
          try {
              $names = @($archive.Entries | ForEach-Object { $_.FullName })
              if (-not ($names -contains "PodcastsAmbMatxa/PodcastsAmbMatxa.exe")) {
                  throw "L'executable no figura al ZIP publicable"
              }
              foreach ($voice in @("joana", "enric")) {
                  $sample = "PodcastsAmbMatxa/_internal/assets/previews/preview_styletts_2_$voice.wav"
                  if (-not ($names -contains $sample)) {
                      throw "Falta la mostra de $voice al ZIP: $sample"
                  }
              }
          } finally {
              $archive.Dispose()
          }

      - name: Pujar artefacte comprimit a GitHub Actions
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodcastsAmbMatxa-Windows
          path: dist/PodcastsAmbMatxa-*-Windows.zip
          if-no-files-found: error

      # =========================================================================
      # PAS DE SIGNPATH (S'activarà quan la SignPath Foundation aprovi el projecte)
      # =========================================================================
      # - name: Sol·licitar signatura digital a SignPath Foundation
      #   if: github.event_name == 'release' && env.SIGNPATH_API_TOKEN != ''
      #   uses: signpath/github-action-submit-signing-request@v3
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: 'podcasts-amb-matxa'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: './dist/signed'
      #   env:
      #     SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

      - name: Adjuntar paquet a la Release de GitHub (si correspon)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PodcastsAmbMatxa-*-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publicació puntual de la v1.1.3, activada en fusionar la PR a main.
      # El ZIP es crea i es comprova abans de publicar la release.
      - name: Publicar release v1.1.3 amb el ZIP Windows
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "dist/PodcastsAmbMatxa-v1.1.3-Windows.zip"
          if (-not (Test-Path $archive)) {
              throw "No s'ha generat el ZIP Windows v1.1.3."
          }
          gh release view v1.1.3 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload v1.1.3 $archive --clobber --repo "${{ github.repository }}"
          } else {
              gh release create v1.1.3 $archive --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Pòdcasts amb Matxa v1.1.3" --notes-file docs/RELEASE_NOTES_v1.1.3.md --latest
          }
          if ($LASTEXITCODE -ne 0) {
              throw "No s'ha pogut publicar la release v1.1.3."
          }
